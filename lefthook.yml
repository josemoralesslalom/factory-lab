pre-commit:
  jobs:
    - name: format
      glob: "**/*.{ts,tsx,js,mjs,json,md,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    - name: lint
      glob: "**/*.{ts,tsx,js,mjs}"
      run: pnpm exec eslint --max-warnings 0 {staged_files}

pre-push:
  jobs:
    - name: verify
      run: pnpm verify
