pre-commit:
  jobs:
    - name: format
      glob: "**/*.{ts,tsx,js,mjs,mts,json,md,yml,yaml,html,scss}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    - name: lint
      glob: "**/*.{ts,tsx,js,mjs,mts,html}"
      run: pnpm exec eslint --max-warnings 0 {staged_files}
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}

pre-push:
  jobs:
    - name: verify
      run: pnpm verify
